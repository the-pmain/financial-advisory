<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Helfenstein Financial Portal Pro trading platform">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b1122"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7fd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d7fd6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="380" height="214" fill="url(#sky)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="380" height="22" fill="#131b30"/>
  <circle cx="14" cy="11" r="3" fill="#3a4560"/>
  <circle cx="26" cy="11" r="3" fill="#3a4560"/>
  <circle cx="38" cy="11" r="3" fill="#3a4560"/>
  <text x="54" y="15" font-family="Inter, Arial, sans-serif" font-size="8" fill="#8f9bb8">Helfenstein Financial Portal Pro</text>

  <!-- left watchlist -->
  <rect x="12" y="34" width="104" height="168" fill="#151d33"/>
  <g font-family="Inter, Arial, sans-serif" font-size="7">
    <text x="20" y="48" fill="#8f9bb8">Watchlist</text>
    <text x="20" y="66" fill="#e6eaf3">SMI</text><text x="108" y="66" fill="#7ec98a" text-anchor="end">+0.4%</text>
    <text x="20" y="82" fill="#e6eaf3">NESN</text><text x="108" y="82" fill="#e07a6d" text-anchor="end">-0.8%</text>
    <text x="20" y="98" fill="#e6eaf3">ROG</text><text x="108" y="98" fill="#7ec98a" text-anchor="end">+1.1%</text>
    <text x="20" y="114" fill="#e6eaf3">NOVN</text><text x="108" y="114" fill="#7ec98a" text-anchor="end">+0.2%</text>
    <text x="20" y="130" fill="#e6eaf3">UBSG</text><text x="108" y="130" fill="#e07a6d" text-anchor="end">-0.5%</text>
    <text x="20" y="146" fill="#e6eaf3">ZURN</text><text x="108" y="146" fill="#7ec98a" text-anchor="end">+0.7%</text>
    <text x="20" y="162" fill="#e6eaf3">ABBN</text><text x="108" y="162" fill="#7ec98a" text-anchor="end">+0.3%</text>
    <text x="20" y="178" fill="#e6eaf3">SREN</text><text x="108" y="178" fill="#e07a6d" text-anchor="end">-0.1%</text>
  </g>

  <!-- chart panel -->
  <rect x="126" y="34" width="242" height="112" fill="#151d33"/>
  <g stroke="#25304d" stroke-width="0.6">
    <line x1="126" y1="62" x2="368" y2="62"/>
    <line x1="126" y1="90" x2="368" y2="90"/>
    <line x1="126" y1="118" x2="368" y2="118"/>
  </g>
  <path d="M132 132 L156 118 L178 124 L200 100 L222 108 L244 84 L266 92 L288 70 L310 78 L332 58 L360 48 L360 146 L132 146 Z" fill="url(#area)"/>
  <path d="M132 132 L156 118 L178 124 L200 100 L222 108 L244 84 L266 92 L288 70 L310 78 L332 58 L360 48" fill="none" stroke="#7ea6e8" stroke-width="1.6"/>
  <text x="134" y="46" font-family="Inter, Arial, sans-serif" font-size="7" fill="#8f9bb8">SMI ? 1D</text>

  <!-- depth / order book -->
  <rect x="126" y="152" width="118" height="50" fill="#151d33"/>
  <g font-family="Inter, Arial, sans-serif" font-size="6">
    <text x="132" y="164" fill="#8f9bb8">Bid</text>
    <text x="132" y="176" fill="#7ec98a">11&#8217;842</text>
    <text x="132" y="186" fill="#7ec98a">11&#8217;841</text>
    <text x="132" y="196" fill="#7ec98a">11&#8217;840</text>
    <text x="196" y="164" fill="#8f9bb8">Ask</text>
    <text x="196" y="176" fill="#e07a6d">11&#8217;844</text>
    <text x="196" y="186" fill="#e07a6d">11&#8217;845</text>
    <text x="196" y="196" fill="#e07a6d">11&#8217;846</text>
  </g>

  <!-- order ticket -->
  <rect x="250" y="152" width="118" height="50" fill="#151d33"/>
  <text x="256" y="164" font-family="Inter, Arial, sans-serif" font-size="6" fill="#8f9bb8">Order</text>
  <rect x="256" y="170" width="50" height="12" fill="#1f2b47"/>
  <rect x="312" y="170" width="50" height="12" fill="#1f2b47"/>
  <rect x="256" y="186" width="106" height="12" rx="6" fill="#9A5F38"/>
  <text x="309" y="195" font-family="Inter, Arial, sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">Buy</text>
</svg>
